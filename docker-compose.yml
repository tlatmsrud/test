services:
  postgres:
    image: postgres:16-alpine
    container_name: testsite-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: testsite
      POSTGRES_USER: testsite
      POSTGRES_PASSWORD: testsite
    volumes:
      - testsite-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: testsite-redis
    ports:
      - "6379:6379"

volumes:
  testsite-postgres:
